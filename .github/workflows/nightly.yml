name: Nightly tests

# Runs the slow suites (Playwright public + authenticated, pgTAP DB integration)
# once a night instead of on every commit/PR. After all of them finish, the
# `report` job aggregates the results into a job summary AND opens/updates a
# tracking GitHub issue so failures are surfaced (and email-notified to repo
# watchers) without any external secret.
#
# NOTE: GitHub only fires `schedule` triggers from the default branch (main), so
# the cron below takes effect once this file is merged to main. Until then (and
# any time), use the "Run workflow" button (workflow_dispatch) to launch it.

on:
  schedule:
    # Nightly — 01:00 UTC (02:00 in Tunisia; Africa/Tunis is UTC+1, no DST).
    # Public repo → unlimited free Actions, so the full suite runs every night.
    - cron: "0 1 * * *"
  workflow_dispatch:

# `report` opens/updates a tracking issue; the called suites only read contents.
permissions:
  contents: read
  issues: write

jobs:
  e2e:
    name: E2E (public)
    uses: ./.github/workflows/e2e.yml

  e2e-auth:
    name: E2E (authenticated)
    uses: ./.github/workflows/e2e-auth.yml
    # Forward TEST_SUPABASE_* / E2E_USER_PASSWORD so the suite can run (it skips
    # gracefully when they're unset).
    secrets: inherit

  pgtap:
    name: DB integration (pgTAP)
    uses: ./.github/workflows/db-tests.yml

  perf:
    name: Performance (load — smoke)
    # Validates the k6 harness always; runs the actual smoke load test only when
    # the LOAD_SUPABASE_* secrets are configured (skips green otherwise).
    uses: ./.github/workflows/perf.yml
    secrets: inherit
    with:
      stage: smoke

  push-health:
    name: Production push configured
    # Étude 40, lot 1 — « le push se prouve ». Le push est resté mort en production des
    # mois (CRON_SECRET et VITE_VAPID_PUBLIC_KEY absents de Vercel) sans que rien ne le dise.
    # `/api/health` rend `push: "configured" | "unconfigured"` (les quatre variables serveur
    # présentes, aucune valeur rendue) ; cette étape exige `configured` de la production,
    # chaque nuit. Un échec ouvre/tient l'issue `nightly-failure` comme les autres suites.
    # La clé du navigateur, elle, est gardée au build (scripts/check-push-build-env.mjs).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      PROD_URL: https://www.na9ranal3ab.tn
      # User-Agent de navigateur : la sonde passe avant le garde anti-robots, mais un
      # changement d'ordre dans server.ts ne doit pas rougir cette étape à tort.
      UA: "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 Chrome/126.0 Mobile Safari/537.36"
    steps:
      - name: Assert /api/health reports push "configured"
        run: |
          set -euo pipefail
          body=""
          for attempt in 1 2 3; do
            if body="$(curl -sS -L -A "$UA" --max-time 20 "$PROD_URL/api/health")" \
              && printf '%s' "$body" | jq -e . >/dev/null 2>&1; then
              break
            fi
            body=""
            echo "Tentative $attempt : /api/health n'a pas rendu de JSON — nouvel essai dans 15 s."
            sleep 15
          done
          if [ -z "$body" ]; then
            echo "::error::/api/health de la production ne répond pas en JSON après 3 essais."
            exit 1
          fi
          echo "Sonde : $body"
          push="$(printf '%s' "$body" | jq -r '.push // "absent"')"
          commit="$(printf '%s' "$body" | jq -r '.commit // "?"')"
          {
            echo "### 🔔 Push en production"
            echo
            echo "\`$PROD_URL/api/health\` → \`push: $push\` (commit \`$commit\`)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$push" != "configured" ]; then
            echo "::error::Production push = \"$push\" (attendu \"configured\") : une des variables VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY / VAPID_SUBJECT / CRON_SECRET manque au projet Vercel na9ranal3ab. Voir docs/environment-variables.md § Web Push."
            exit 1
          fi

  report:
    name: Nightly report
    needs: [e2e, e2e-auth, pgtap, perf, push-health]
    # Always run so the report reflects failures too, not just all-green nights.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Aggregate results and update tracking issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_AUTH_RESULT: ${{ needs.e2e-auth.result }}
          PGTAP_RESULT: ${{ needs.pgtap.result }}
          PERF_RESULT: ${{ needs.perf.result }}
          PUSH_HEALTH_RESULT: ${{ needs.push-health.result }}
        with:
          script: |
            const results = {
              'E2E (public)': process.env.E2E_RESULT,
              'E2E (authenticated)': process.env.E2E_AUTH_RESULT,
              'DB integration (pgTAP)': process.env.PGTAP_RESULT,
              'Performance (load)': process.env.PERF_RESULT,
              'Push configuré en production': process.env.PUSH_HEALTH_RESULT,
            };
            const icon = (r) =>
              r === 'success' ? '✅' : r === 'skipped' ? '⏭️' : '❌';
            const failed = Object.values(results).some(
              (r) => r !== 'success' && r !== 'skipped',
            );

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const date = new Date().toISOString().slice(0, 10);

            let body = `### 🌙 Nightly tests — ${date}\n\n`;
            body += `| Suite | Résultat |\n| --- | --- |\n`;
            for (const [name, r] of Object.entries(results)) {
              body += `| ${name} | ${icon(r)} ${r} |\n`;
            }
            body += `\n[Voir le run complet](${runUrl})\n`;

            // Always publish the run summary.
            await core.summary.addRaw(body).write();

            const LABEL = 'nightly-failure';
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: LABEL });
            } catch {
              await github.rest.issues.createLabel({
                ...context.repo,
                name: LABEL,
                color: 'b60205',
                description: 'Échec du nightly build',
              });
            }

            const existing = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: LABEL,
            });

            if (failed) {
              const title = '🌙 Nightly tests en échec';
              if (existing.data.length > 0) {
                const n = existing.data[0].number;
                await github.rest.issues.update({ ...context.repo, issue_number: n, title });
                await github.rest.issues.createComment({ ...context.repo, issue_number: n, body });
              } else {
                await github.rest.issues.create({ ...context.repo, title, body, labels: [LABEL] });
              }
              core.setFailed('Nightly suite(s) failed — see the tracking issue.');
            } else {
              // All green: close any open failure issue with a success note.
              for (const issue of existing.data) {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: issue.number,
                  body: body + '\n✅ Tout est repassé au vert — fermeture automatique.',
                });
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: issue.number,
                  state: 'closed',
                });
              }
            }
