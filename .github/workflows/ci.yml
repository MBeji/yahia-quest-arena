name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Runs on PRs (tests the merge result) and on pushes to main (a green signal on
# the default branch). Cancel superseded runs on the same ref so rapid pushes
# don't stack runners; "Run workflow" is available for an on-demand run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo (no write scopes). On a public repo a
# fork-PR token is read-only anyway, but make it explicit and default-proof.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Sans plafond, le défaut de GitHub est SIX HEURES. Le 2026-08-19, le miroir
    # Azure d'Ubuntu est tombé : `apt-get` s'est figé dans l'installation des
    # dépendances de Chromium et TROIS runs (dont un sur main) ont gelé un runner
    # chacun pendant plus d'une heure, sans qu'aucun n'échoue jamais. 25 min
    # couvrent largement le job (12 étapes en ~5 min) et transforment un blocage
    # d'infrastructure en échec lisible.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # ── Canari npm 10 — arbitrage A17 du 2026-08-24 ───────────────────────
      #
      # Rejoue la résolution du lockfile avec la version de npm de l'AUTRE CI.
      # Ce n'est pas une redondance : c'est le seul détecteur qui ait jamais
      # attrapé #716.
      #
      # Ce qui s'était passé — une PR Dependabot intitulée « bump undici …
      # dependency-type: indirect » faisait en réalité monter
      # `@cloudflare/vite-plugin` de ^1.40.2 à ^1.51.1, entraînant miniflare
      # 4 → 5-alpha, workerd et wrangler : DEUX majeures et une ALPHA dans la
      # chaîne de build, sous un titre de bump indirect. Sa régénération du lock
      # a supprimé un `typescript@5.9.3` imbriqué qu'exigeait une peer optionnelle.
      # Résultat : `npm ci` mort — mais seulement sous npm 10 — donc Content CI
      # privée rouge 33 h, `main` comprise, pendant que le gate d'ici restait
      # vert. Aggravant : `ci.yml` n'avait même pas tourné sur le commit fautif.
      #
      # Le poste tournait alors en Node 22 / npm 10, dont le `npm ci` est plus
      # sévère. C'est LUI qui a refusé le lock. L'alignement sur Node 24 (npm 11)
      # a supprimé ce filet — une propriété ACCIDENTELLE, donc fragile, mais la
      # seule qui ait fonctionné là où tout le reste était vert.
      #
      # Trois options étaient sur la table (ROADMAP privée, A17) : revenir à
      # Node 22, poser une garde de diff sur les titres de PR, ou ceci. Arbitrage
      # du propriétaire : ceci — parce que ça rétablit EXACTEMENT la propriété
      # perdue, mais DÉLIBÉRÉMENT. Elle ne peut plus disparaître au prochain
      # `.nvmrc`, et elle est écrite là où on la lira. C'est aussi, mot pour mot,
      # le réflexe n°1 que `docs/dependency-maintenance.md` avait lui-même tiré
      # de l'incident : « une panne "npm ci ne casse que là-bas" se reproduit
      # avec la version de npm de l'autre CI, pas avec celle qu'on a sous la
      # main ».
      #
      # Dans le job `verify`, donc dans un check REQUIS : un canari qui ne
      # bloque pas est un canari qu'on lit après coup. Toujours joué, jamais
      # conditionné au diff — le lock peut casser sans qu'une PR de dépendance
      # y touche, et `--dry-run` n'écrit rien.
      # ⚠️ `--ignore-scripts` n'est pas cosmétique : sans lui, `npm ci` rejoue le
      # `prepare` du projet (husky) au milieu du gate, pour rien. Éprouvé avant
      # livraison, dans les deux sens, en reproduisant #716 sur une copie du
      # lock (suppression de l'entrée imbriquée `vite-tsconfig-paths/node_modules/
      # typescript`, exactement ce que la régénération fautive avait fait) :
      #   • npm 11 — « added 511 packages », VERT. C'est pourquoi ce dépôt
      #     n'avait rien vu ;
      #   • npm 10 — « Missing: typescript@5.9.3 from lock file », ROUGE.
      # Le différentiel est donc réel et mesuré, pas supposé.
      #
      # Piège de lecture pour la prochaine session : en cas d'échec, lire le
      # DÉBUT de la sortie de npm, pas la fin. npm affiche sa bannière d'aide
      # après l'erreur, et un `| tail` fait croire à un drapeau refusé alors que
      # la cause — `EUSAGE`, avec le paquet manquant nommé — est en tête.
      - name: Canari npm 10 (le lockfile tient-il chez l'autre CI ?)
        run: |
          set -uo pipefail
          echo "npm de ce job : $(npm --version) · canari : npm@10"
          if ! npx --yes npm@10 ci --dry-run --no-audit --no-fund --ignore-scripts; then
            echo "::error title=Lockfile refusé par npm 10::Ce lockfile s'installe sous npm 11 mais PAS sous npm 10 — c'est la panne #716, qui avait laissé la Content CI privée rouge 33 h pendant que ce gate restait vert. Lire le DÉBUT de la sortie ci-dessus (le paquet manquant y est nommé), pas la bannière d'aide en fin. Remède : ne pas re-synchroniser le lock à l'aveugle, regarder ce que le bump a fait entrer — voir docs/dependency-maintenance.md."
            exit 1
          fi

      # Anti-leak gate (étude 24, lot 4). Since the corpus split, the pedagogical
      # corpus, the generation factory (content-*/prof-* skills) and the compiled
      # content SQL live in the PRIVATE repo MBeji/yahia-quest-content. This step
      # fails the build if any of them reappears here — the failure mode RISK-8
      # predicts: a future session re-committing corpus out of habit.
      #
      # The content gates that used to run here (content:check, content:qa:strict,
      # content:audit:strict) and the transcription registry gate (programme:check)
      # moved WITH their data: they now run in the private repo's Content CI, which
      # checks this repo out for the engine. The engine itself — scripts/content/,
      # src/shared/content/ — stays here and stays covered by the unit gate.
      - name: Anti-leak gate (no corpus in the public repo)
        run: npm run leak:check

      # Migration-chain reconstructibility (2026-07-20). pgTAP (db-tests.yml) is
      # the only tier that actually rebuilds a blank database. It DOES run on PRs
      # (path-filtered) since 2026-07-20, but it is not a required check — a red
      # there does not stop auto-merge. Back when it was nightly-only, étude 24 lot 4
      # (#544) took the generated content migrations out of this repo, FOUR
      # breakages (#548, #549, #552, #557) reached main unseen and were dug out
      # one at a time by hand-dispatching the nightly, ~4 min a round.
      #
      # This step replays the chain statically — accumulating the ids each
      # migration creates, evaluating the WHERE EXISTS guards — and fails on any
      # orphan FK, any pgTAP fixture id colliding with a migration id, and any
      # duplicate migration version. Validated against the four revisions above:
      # it flags three of them (the fourth, #549, is a CHECK constraint, out of
      # reach of an FK replay). ~0.2 s, no database needed.
      - name: Migration chain (blank DB rebuilds)
        run: npm run db:check-chain

      # Harness anti-drift gate (étude 25): CLAUDE.md stays a thin @AGENTS.md
      # pointer, AGENTS.md stays in budget, no hidden Unicode, no model id
      # hardcoded outside harness/models.json.
      - name: Harness check
        run: npm run harness:check

      # Keep the k6 load harness (perf/) from rotting: every scenario must parse,
      # and its constants must still mirror the product hot paths (LEADERBOARD_LIMIT,
      # submit rate-limit budget). No k6 binary / Supabase secrets needed.
      - name: Perf harness sync check
        run: npm run perf:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Build + bundle budgets
        run: npm run build:check

      # Production-shell browser smoke (incident 2026-07-01): builds and loads
      # the REAL prod bundle in Chromium and fails on any page error / error
      # page. The only tier that exercises prod-gated client code
      # (`import.meta.env.PROD`) — tsc, the unit gate, SSR checks and the
      # dev-server e2e all miss that class of crash.
      # `--with-deps` RETIRÉ (2026-08-19). Il lançait `apt-get` à chaque PR pour
      # installer les bibliothèques système de Chromium — que l'image
      # `ubuntu-latest` embarque déjà. Le jour où le miroir Ubuntu du runner est
      # tombé, cette dépendance inutile a gelé toute la CI du dépôt : apt attendait
      # `archive.ubuntu.com` indéfiniment, et le téléchargement du navigateur n'a
      # même jamais commencé. S'il manquait vraiment une lib, le smoke échouerait
      # en quelques secondes et le dirait — au lieu de pendre.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium (shell smoke)
        run: npx playwright install chromium

      - name: Production shell smoke (real browser)
        run: npm run smoke:shell

      - name: Runtime dependency audit
        run: npm run audit:deps

  # The `content` job lived here until étude 24 lot 3b. It ran content:check /
  # content:qa:strict / content:audit:strict against the corpus; the corpus now
  # lives in the private repo, so the job moved there (Content CI, double checkout:
  # private corpus + this repo for the engine). Removing it here is deliberate —
  # see the anti-leak gate in `verify` above and docs/content-generation-pipeline.md.
