name: Garde de la boîte noire client (refus d'auth ET soumissions perdues)

# LA MOITIÉ DÉTECTION DU MÉCANISME ANTI-RECHUTE — #938, premier lot.
#
# ⚠️ ÉLARGIE LE 2026-09-04, ET LA RAISON VAUT D'ÊTRE LUE. Cette garde n'a longtemps
# relevé que des refus d'AUTH — non par choix, mais parce que `reportClientError`
# n'était appelé que derrière `isSessionRefusalError` : une soumission de mission
# qui échouait pour toute autre raison n'écrivait pas une ligne. Le 2026-09-03, un
# élève a fait ses exercices, validé, et le suivi parental du lendemain n'en
# montrait aucun ; le run de 21:07 UTC a répondu « 0 refus dans la fenêtre », et il
# disait vrai. Une garde qui ne regarde pas la panne en cours ne ment pas — elle
# rassure, ce qui est pire. Les écrivains remontent désormais TOUT échec de
# soumission, et un seuil PROPRE (bien plus bas) sépare le travail d'élève perdu
# des sessions refusées.
#
# #933 a livré la moitié PRÉVENTION : un refus d'authentification que le client
# ignore ne compile plus. La moitié détection manquait, et elle était plus creuse
# qu'il n'y paraît : les deux pannes récurrentes — « Failed to load dashboard »
# (#931) et le bouton « Valider » grisé sans fin (#914/#915) — ont TOUTES DEUX été
# signalées par le propriétaire, jamais par une garde. L'instrumentation existait
# pourtant, et elle est bonne : la table `client_errors`, la route `/api/client-log`
# délibérément sans jeton, et trois grandeurs qui départagent les hypothèses.
#
# Personne ne lisait cette table. Vérifié le 2026-09-01 : ses seuls consommateurs
# dans tout le dépôt étaient son writer, son test, et deux mentions en doc.
# Résultat mesuré : entre le 2026-08-18 et le 2026-08-31, la même panne a couru
# TREIZE JOURS en produisant des lignes que rien ne relevait.
#
# CE QUE CETTE GARDE FAIT, ET SURTOUT CE QU'ELLE NE FAIT PAS
# ---------------------------------------------------------------------------
# LECTURE SEULE. Elle n'écrit rien en base, ne corrige rien, ne relance rien.
# Elle tient UNE issue ouverte tant que le signal dépasse son bruit de fond, et
# la referme d'elle-même quand une fenêtre est propre. Même forme que
# `guard-watch.yml` et que `content-drift.yml` au privé.
#
# SON PROPRE FILET
# ---------------------------------------------------------------------------
# Une garde qui plante en silence n'est pas une garde. Celle-ci n'a pas besoin
# d'un filet à elle : `guard-watch.yml` relève toutes les 6 h les runs rouges de
# TOUS les workflows programmés de ce dépôt, celui-ci compris — c'est exactement
# ce pour quoi il a été écrit, et c'est la forme qui ne se périme pas quand on
# ajoute un workflow.
#
# ⚠️ LE SECRET, ET LA LEÇON DE 2026-07-29
# ---------------------------------------------------------------------------
# `client_errors` est en RLS SANS policy, privilèges `REVOKE`d : seule
# `PROD_SUPABASE_SERVICE_ROLE_KEY` y lit. Tant que le secret est ABSENT, ce job
# SAUTE PROPREMENT EN RESTANT VERT — un rouge permanent est précisément ce qui
# apprend à ne plus lire une issue de suivi. Mais s'il est PRÉSENT et que la
# lecture échoue, le job ÉCHOUE BRUYAMMENT : c'est la leçon de `PROD_SUPABASE_URL`
# posé sans son `https://`, qui a passé un pré-vol ne testant que la non-vacuité
# et tué 25 jours de triage en silence. D'où, aussi, l'URL résolue DEPUIS LE
# DÉPÔT (`prod-targets.mjs`) plutôt que depuis un second secret : le besoin
# supprimé plutôt que le secret reposé.

on:
  schedule:
    # Toutes les 6 h, minute décalée (les crons ronds partent en retard).
    - cron: "23 */6 * * *"
  workflow_dispatch:

concurrency:
  group: client-errors-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    name: la boîte noire dit-elle quelque chose ?
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      LABEL: panne-client
      # Fenêtre plus large que le cron À DESSEIN : deux passages se recouvrent,
      # donc aucune rafale ne peut se glisser entre deux fenêtres. Le recouvrement
      # ne produit pas de doublon — une seule issue est réutilisée.
      WINDOW_HOURS: "8"
    steps:
      - name: Le secret est-il configuré ?
        id: guard
        run: |
          set -euo pipefail
          if [ -z "${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ⏭️ Garde de la boîte noire client — sautée"
              echo ""
              echo "\`PROD_SUPABASE_SERVICE_ROLE_KEY\` n'est pas configuré. \`client_errors\` est en"
              echo "RLS sans policy : sans cette clé il n'y a rien à lire, et **échouer ici"
              echo "installerait un rouge permanent** — ce qui apprend à ne plus lire une issue de"
              echo "suivi. Le job sort donc vert, en le disant."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.configured == 'true'
        run: npm ci --no-audit --no-fund

      # Depuis le DÉPÔT, jamais depuis un secret — voir l'en-tête. Une valeur
      # malformée arrête ici, bruyamment, au lieu de mourir dans `createClient`.
      - name: Résoudre l'URL de production (depuis le dépôt)
        if: steps.guard.outputs.configured == 'true'
        run: |
          set -euo pipefail
          url="$(node --input-type=module -e 'const m = await import("./scripts/shared/prod-targets.mjs"); process.stdout.write(m.PROD_SUPABASE_API_URL)')"
          if ! printf '%s' "$url" | grep -qE '^https://[a-z0-9]+\.supabase\.co$'; then
            echo "::error::PROD_SUPABASE_API_URL ne résout pas vers une URL d'API Supabase (reçu '$url') — voir scripts/shared/prod-targets.mjs."
            exit 1
          fi
          echo "PROD_SUPABASE_API_URL=$url" >> "$GITHUB_ENV"

      # Le seul appel réseau. `set -e` fait échouer le job si la lecture échoue :
      # secret présent mais malformé ⇒ rouge, pas silence.
      - name: Relever les refus de la fenêtre (lecture seule)
        if: steps.guard.outputs.configured == 'true'
        env:
          SUPABASE_URL: ${{ env.PROD_SUPABASE_API_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          npm run --silent reports:client-errors -- --window-hours "$WINDOW_HOURS" --out client-errors.json

      - name: Décider — ouvrir, mettre à jour, ou refermer
        if: steps.guard.outputs.configured == 'true'
        run: |
          set -euo pipefail

          alertes="$(jq -r '.alertes | length' client-errors.json)"
          total="$(jq -r '.total' client-errors.json)"
          perdues="$(jq -r '.soumissionsPerdues' client-errors.json)"
          echo "Lignes dans la fenêtre : $total (dont $perdues soumissions perdues) · alertes : $alertes"

          if [ "$alertes" = "0" ]; then
            existing="$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')"
            if [ -n "$existing" ]; then
              gh issue close "$existing" \
                --comment "✅ Fenêtre de ${WINDOW_HOURS} h propre ($total lignes dont $perdues soumissions perdues, sous les seuils) — fermeture automatique." >/dev/null
              echo "Issue #$existing refermée."
            else
              echo "Rien à signaler ($total lignes, $perdues soumissions perdues, sur ${WINDOW_HOURS} h)."
            fi
            {
              echo "### ✅ Boîte noire client — rien à signaler"
              echo ""
              echo "$total ligne(s) sur les ${WINDOW_HOURS} dernières heures, dont $perdues soumission(s)"
              echo "de mission non abouties. Sous les seuils."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### 🔐 La boîte noire client a quelque chose à dire"
            echo ""
            echo "Fenêtre : les **${WINDOW_HOURS} dernières heures** (depuis \`$(jq -r '.window.since' client-errors.json)\` UTC)."
            echo ""
            jq -r '.alertes[] | "- \(.)"' client-errors.json
            echo ""
            echo "| stage | lignes | ce qu'il raconte |"
            echo "| --- | --- | --- |"
            jq -r '.parStage | to_entries[] | "| `\(.key)` | \(.value) | \($legende[.key] // "—") |"' \
              --argjson legende "$(jq -c '.legendeStages' client-errors.json)" client-errors.json
            echo ""
            echo "| message (tel que \`auth-refusals.ts\` l'écrit) | refus |"
            echo "| --- | --- |"
            jq -r '.parMessage | to_entries[] | "| `\(.key)` | \(.value) |"' client-errors.json
            echo ""
            echo "**Du travail d'élève perdu ?** \`$perdues\` soumission(s) de mission n'ont pas abouti"
            echo "dans la fenêtre, sur \`$total\` lignes. C'est le compte qui prime : les autres"
            echo "mesurent des sessions refusées, celui-ci mesure des exercices faits et non"
            echo "enregistrés — invisibles dans la progression de l'élève comme dans le suivi parental."
            echo ""
            echo "**Départager les hypothèses** — les trois grandeurs que \`reportClientError\` emporte :"
            echo ""
            echo "| lecture | compte |"
            echo "| --- | --- |"
            echo "| jeton encore valide (> 60 s) et pourtant refusé | $(jq -r '.horloge.jetonValideRefuse' client-errors.json) |"
            echo "| jeton que l'appareil se savait expiré (≤ 0 s) | $(jq -r '.horloge.jetonExpire' client-errors.json) |"
            echo "| retour de veille (> 60 s onglet caché) | $(jq -r '.horloge.retourDeVeille' client-errors.json) |"
            echo ""
            echo "Une colonne « jeton valide refusé » non nulle **disqualifie l'expiration simple** et"
            echo "confirme le diagnostic d'horloge de #914. Une colonne « retour de veille » dominante"
            echo "désignerait plutôt le gel des minuteries mobiles. Les deux peuvent coexister."
            echo ""
            echo "⚠️ Les seuils (\`SEUILS\` dans \`scripts/reports/export-client-errors.mjs\`) sont des"
            echo "**hypothèses de départ**, posées haut à dessein et jamais mesurées sur une vraie"
            echo "semaine. Si cette issue s'ouvre pour une journée ordinaire, c'est le seuil qu'il"
            echo "faut corriger — les comptes bruts sont là pour ça."
            echo ""
            echo "_Cette issue se referme toute seule dès qu'une fenêtre entière est sous les seuils._"
          } > corps.md

          gh label create "$LABEL" --color 5319e7 \
            --description "Panne subie par le client en production (auth, soumissions)" 2>/dev/null || true

          # Le titre nomme le PIRE des deux faits. Un « refus d'auth en rafale »
          # posé sur une soirée d'exercices perdus ferait chercher au mauvais
          # endroit — et c'est ainsi qu'on apprend à ne plus lire une issue.
          if [ "$perdues" -ge 1 ]; then
            titre="📉 Soumissions perdues ($perdues sur ${WINDOW_HOURS} h, $total lignes)"
          else
            titre="🔐 Refus d'auth en rafale ($total sur ${WINDOW_HOURS} h)"
          fi
          existing="$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$titre" --body-file corps.md >/dev/null
            echo "Issue #$existing mise à jour."
          else
            gh issue create --title "$titre" --label "$LABEL" --body-file corps.md
          fi

          cat corps.md >> "$GITHUB_STEP_SUMMARY"
