name: Auto PR

# Completes the commit→push→merge chain with ZERO human steps (décision
# 2026-07-12 — CLAUDE.md DoD §8): pushing ANY non-main branch opens its pull
# request READY with auto-merge armed, so it merges alone the moment the
# ruleset's required checks are green on an up-to-date head (automerge.yml
# keeps armed heads up to date). Nobody reads, readies or merges by hand — the
# required checks ARE the gate, and the session that pushed watches them until
# the merge lands.
#
# Deliberate WIP is the opt-out, not the default: `[wip]` or `[draft]` (or
# `[no-automerge]`) in the head-commit subject — or a `wip/`, `draft/` or
# `rescue/` branch prefix — opens a DRAFT PR instead (nothing arms; promote
# later with `gh pr ready`). The `no-automerge` label freezes an already-open
# PR (automerge.yml disarms it). An existing draft PR is never promoted by a
# later push: whoever drafted it decides when it ships.
#
# Why GH_AUTOMATION_PAT (optional secret), not just GITHUB_TOKEN: a PR opened
# by the `github-actions[bot]` actor (GITHUB_TOKEN's identity) is NOT a repo
# collaborator, and GitHub gates every `pull_request`-triggered run on such a
# PR behind manual "Approve and run" — the same mechanism used for fork PRs
# from outside contributors, applied here to our own automation (confirmed
# live: CI/CodeQL/Migration gate/Auto-merge all sat at conclusion
# `action_required` on bot-opened PRs, non-deterministically racing against
# our workaround dispatches below — sometimes the dispatched run reported
# green first, sometimes the gated native run "won" and the PR showed stuck
# pending approval). A PAT belonging to an actual collaborator makes every
# event's actor that collaborator, so nothing is ever gated — deterministic,
# no manual approval, ever. Provision it as a fine-grained PAT scoped to this
# repo only (contents:write, pull requests:write, workflows:write) stored in
# Settings > Secrets and variables > Actions as `GH_AUTOMATION_PAT`. Without
# it, this workflow still works via the GITHUB_TOKEN fallback below, whose
# gated native runs are covered by the `gh workflow run` dispatch in the last
# step. That dispatch is no longer reserved to the PAT-less path: since
# 2026-08-24 it runs ALWAYS, for the reasons written on the step itself.
#
# MERGE FREEZE (incident en cours). The repository variable `MERGE_FREEZE`
# (Settings > Secrets and variables > Actions > Variables) is the kill-switch
# for this whole chain: set to `1`, every pushed branch opens as a DRAFT and
# nothing arms, so no merge can reach `main` — and therefore no deploy can
# undo a production rollback. Without it, rolling production back on Vercel
# lasts exactly until the next PR merges itself (docs/prod-rollback-runbook.md).
# `hotfix/` and `revert/` branches are EXEMPT: the fix that ENDS the incident
# must still be able to ship, and it still passes the full required-check gate.
# Set/clear it with `gh variable set MERGE_FREEZE --body 1|0`, or via the
# `rollback-prod.yml` workflow (modes `freeze-only` / `unfreeze`).

on:
  push:
    branches-ignore:
      - main
      # upgrade-guard.yml opens this one itself, and its draft/ready choice encodes the
      # gate result (`ci:verify` green → ready, red → draft + needs-review) while the
      # `no-automerge` label holds the merge back until E2E + pgTAP are green too. Letting
      # this workflow race it would open the PR ready and armed whatever the gate said.
      - "claude/upgrade-patch-minor-*"

# One run per branch; a rapid second push supersedes the first.
concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  # write (not read): arming auto-merge calls enablePullRequestAutoMerge,
  # which GitHub gates on contents:write — with read it fails with "Resource
  # not accessible by integration" (bit us on #272). The merge itself stays
  # gated by the ruleset's required checks. Irrelevant when GH_AUTOMATION_PAT
  # is set (the PAT's own scopes govern those calls instead).
  contents: write
  # Create the PR and enable auto-merge.
  pull-requests: write
  # Dispatch the required-check workflows on the new PR's branch. Plus un chemin
  # de secours : la dernière étape dispatche TOUJOURS. Et cette portée n'est pas
  # décorative quand un PAT existe — c'est même là qu'elle sert : le PAT n'ayant
  # pas la permission « Actions », l'étape retombe explicitement sur le
  # `GITHUB_TOKEN`, à qui cette ligne donne le droit de déclencher.
  actions: write

jobs:
  open-pr:
    name: Open PR for pushed branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Falls back to GITHUB_TOKEN when the PAT secret isn't configured — see
      # the header for what that costs (gated native pull_request runs).
      GH_TOKEN: ${{ secrets.GH_AUTOMATION_PAT || secrets.GITHUB_TOKEN }}
      USING_PAT: ${{ secrets.GH_AUTOMATION_PAT != '' }}
      # Kill-switch for the automatic chain — see the header. Unset = normal.
      MERGE_FREEZE: ${{ vars.MERGE_FREEZE }}
    steps:
      - name: Checkout (PR template + head commit subject)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Create the PR if none is open
        id: pr
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          existing="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for $BRANCH — nothing to create."
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "target=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          subject="$(git log -1 --pretty=%s "$HEAD_SHA")"

          # Default: READY (auto-merge armed by the next step). Opt-out to a
          # DRAFT savepoint via a subject token or a branch prefix — rescue/
          # sauvegarde/WIP pushes must use one of these.
          draft_flag=""
          case "$subject" in
            *"[wip]"*|*"[WIP]"*|*"[draft]"*|*"[no-automerge]"*) draft_flag="--draft" ;;
          esac
          case "$BRANCH" in
            wip/*|draft/*|rescue/*) draft_flag="--draft" ;;
          esac

          # Gel des merges (incident) — voir l'en-tête. Rien ne doit pouvoir
          # atteindre `main`, donc rien ne peut redéployer par-dessus un
          # rollback ; hotfix/ et revert/ restent exemptés pour que le
          # correctif qui clôt l'incident puisse passer le gate normalement.
          case "${MERGE_FREEZE:-}" in
            1|true|TRUE|yes|on)
              case "$BRANCH" in
                hotfix/*|revert/*)
                  echo "MERGE_FREEZE actif mais '$BRANCH' est exemptée (branche de correctif) — PR ouverte normalement."
                  ;;
                *)
                  draft_flag="--draft"
                  echo "::warning title=Merges gelés::MERGE_FREEZE actif — PR ouverte en DRAFT et non armée. Voir docs/prod-rollback-runbook.md ; utilisez une branche hotfix/ ou revert/ pour livrer le correctif."
                  ;;
              esac
              ;;
          esac

          body_file="$(mktemp)"
          {
            cat .github/pull_request_template.md
            echo ""
            echo "---"
            echo "_PR ouverte automatiquement par \`auto-pr.yml\` pour la branche \`$BRANCH\`._"
          } > "$body_file"

          # Prerequisite (GITHUB_TOKEN fallback only): Settings > Actions >
          # General > Workflow permissions > "Allow GitHub Actions to create
          # and approve pull requests" must be ON, or createPullRequest is
          # rejected. Not needed when GH_AUTOMATION_PAT is set.
          if ! url="$(gh pr create --repo "$REPO" --base main --head "$BRANCH" \
            $draft_flag --title "$subject" --body-file "$body_file")"; then
            echo "::error title=Auto-PR impossible::Si vous n'utilisez pas GH_AUTOMATION_PAT, activez 'Allow GitHub Actions to create and approve pull requests' (Settings > Actions > General > Workflow permissions), puis relancez ce workflow — ou ouvrez la PR à la main."
            exit 1
          fi
          if [ -n "$draft_flag" ]; then
            echo "Created $url as a DRAFT (deliberate WIP opt-out)."
          else
            echo "Created $url ready for auto-merge."
          fi
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "target=$url" >> "$GITHUB_OUTPUT"

      - name: Arm auto-merge (default — drafts & no-automerge opt out)
        env:
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          TARGET: ${{ steps.pr.outputs.target }}
        run: |
          set -euo pipefail

          # Gel des merges : ne pas armer, et DÉSARMER une PR qui l'était déjà
          # (elle a pu être armée avant que le gel ne soit posé).
          case "${MERGE_FREEZE:-}" in
            1|true|TRUE|yes|on)
              case "$BRANCH" in
                hotfix/*|revert/*) ;;
                *)
                  gh pr merge "$TARGET" --repo "$REPO" --disable-auto >/dev/null 2>&1 \
                    && echo "MERGE_FREEZE actif — auto-merge désarmé sur $TARGET." \
                    || echo "MERGE_FREEZE actif — rien à désarmer sur $TARGET."
                  exit 0
                  ;;
              esac
              ;;
          esac

          # Runs for the fresh PR AND for repeat pushes on an existing one —
          # self-healing: a ready-but-unarmed PR gets armed by its next push.
          # An existing draft stays a draft (deliberate WIP, see header).
          read -r is_draft armed optout <<<"$(gh pr view "$TARGET" --repo "$REPO" \
            --json isDraft,labels,autoMergeRequest \
            --jq '[.isDraft, (.autoMergeRequest != null), any(.labels[]; .name == "no-automerge")] | @tsv')"

          if [ "$is_draft" = "true" ]; then
            echo "Draft PR (deliberate WIP) — not arming; promote with 'gh pr ready' when it must ship."
            exit 0
          fi
          if [ "$optout" = "true" ]; then
            echo "Label no-automerge — not arming."
            exit 0
          fi
          if [ "$armed" = "true" ]; then
            echo "Auto-merge already armed."
            exit 0
          fi

          # Squash + delete-branch: same merge shape as the upgrade guard's lot.
          if gh pr merge "$TARGET" --repo "$REPO" --auto --squash --delete-branch; then
            echo "Auto-merge armed — merges alone once the required checks are green on an up-to-date head."
          else
            echo "::warning title=Auto-merge non armé::Activez 'Allow auto-merge' dans Settings > General du repo."
          fi

      - name: Dispatch the required checks on the branch (toujours)
        # INCONDITIONNEL depuis le 2026-08-24 — c'est le correctif, et le reste
        # de ce commentaire dit pourquoi la condition d'avant était une faute de
        # forme avant d'être une panne.
        #
        # Cette étape portait `env.USING_PAT != 'true'` : avec un PAT de vrai
        # collaborateur, la PR est censée émettre de vrais événements
        # `pull_request` non gatés, donc re-dispatcher n'aurait fait qu'un
        # doublon. Le pari a tenu des semaines, puis a lâché sans rien signaler.
        # Le 2026-08-23, les événements `pull_request` ont cessé de produire le
        # moindre run entre 10:33 et 19:51 UTC alors que le PAT répondait
        # toujours à l'API — il a bien ouvert la PR #823 et armé son auto-merge.
        # Une heure après l'ouverture, `gh run list` sur la branche ne montrait
        # que « Auto PR » ; les 4 checks requis (`verify`, `CodeQL`,
        # `Migration order`, `Migration presence`) sont restés en « Expected —
        # Waiting for status to be reported » ; la PR ne pouvait pas merger
        # seule et il a fallu dispatcher à la main. Les runs `pull_request` sont
        # revenus d'eux-mêmes le lendemain : la panne est TRANSITOIRE, donc
        # invisible, sans cause locale, et reproductible n'importe quand.
        #
        # Le vrai défaut n'est pas la panne, c'est la nature du garde-fou :
        # « un PAT ⇒ de vrais événements » n'est vérifiable d'AUCUNE façon
        # depuis ici. Au moment où cette étape s'exécute, le run `pull_request`
        # n'existe pas encore, et son absence définitive ne se distingue pas de
        # son simple retard. Un pari non vérifiable ne doit pas garder une porte
        # dont l'ouverture est la seule chose qui débloque une livraison.
        #
        # Le prix, assumé : la DUPLICATION. Les groupes de concurrence de ci.yml
        # (`ci-<github.ref>`) et codeql.yml (`codeql-<github.ref>`) sont indexés
        # sur le ref ; un run `pull_request` tourne sur `refs/pull/N/merge` et un
        # run dispatché sur `refs/heads/<branche>` — ils ne s'annulent donc PAS
        # l'un l'autre, et migration-gate.yml n'a même pas de bloc concurrency.
        # On paie donc deux exécutions complètes par check requis. C'est le bon
        # côté de l'échange : quelques minutes de runner en double contre une PR
        # gelée qui coûte une livraison et que personne ne remarque avant des
        # heures. Les deux jumeaux convergent au vert — GitHub évalue un check
        # requis sur le run le plus RÉCENT portant ce nom pour le SHA de tête —
        # au prix d'un bref retour en « pending » le temps que le plus lent
        # finisse. Les deux voient le même monde : `Migration order` diffe contre
        # `origin/main` dans les deux cas, et la ref de merge n'ajoute aucune
        # migration à la branche.
        #
        # Écarté : indexer les groupes de concurrence sur la BRANCHE plutôt que
        # sur le ref, pour que les jumeaux s'annulent proprement. Un run annulé
        # conclut `cancelled`, que la protection de branche lit comme un échec —
        # on troquerait un doublon inoffensif contre un rouge qui dépend de
        # l'ordre d'arrivée, et sur TOUS les runs de ci.yml et codeql.yml, très
        # au-delà de ce correctif.
        #
        # `created == 'true'` reste : on ne re-dispatche pas sur une PR déjà
        # ouverte — ses checks ont déjà tourné, et les pushes suivants les
        # relancent par l'événement `synchronize`.
        if: steps.pr.outputs.created == 'true'
        env:
          # ⚠️ On SURCHARGE ici le `GH_TOKEN` du job (le PAT) par le
          # `GITHUB_TOKEN`, et c'est indispensable : le PAT n'a PAS la
          # permission « Actions ». Constaté au premier run de cette étape
          # (PR #829) — `HTTP 403: Resource not accessible by personal access
          # token` sur POST /actions/workflows/{id}/dispatches, job en échec,
          # zéro workflow déclenché. Ne pas confondre les deux permissions
          # fine-grained voisines : « Workflows » (que le PAT a) autorise à
          # ÉCRIRE les fichiers .github/workflows/**, « Actions » (qu'il n'a
          # pas) autorise à PILOTER les runs.
          #
          # Le `GITHUB_TOKEN`, lui, porte le `actions: write` déclaré plus haut,
          # et `workflow_dispatch` est précisément l'une des deux exceptions à
          # la règle « un événement émis par le GITHUB_TOKEN ne déclenche aucun
          # workflow » — c'est ce sur quoi reposait déjà le chemin sans PAT.
          # Chacun son rôle : le PAT donne l'IDENTITÉ collaborateur (ouvrir la
          # PR, armer l'auto-merge sans passer par « Approve and run »), le
          # GITHUB_TOKEN donne le DROIT de déclencher. Corollaire heureux :
          # cette étape survit à l'expiration du PAT (04/10/2026).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          # ⚠️ Le GITHUB_TOKEN, PAS le PAT — et c'est la correction du
          # 2026-08-24 (soir). Le job tourne avec `GH_TOKEN = PAT || GITHUB_TOKEN`,
          # ce qui convient pour ouvrir la PR et armer l'auto-merge mais PAS pour
          # dispatcher : `GH_AUTOMATION_PAT` n'a pas la portée `actions: write`,
          # et l'API répond `HTTP 403: Resource not accessible by personal access
          # token`. Rendre la dispatch inconditionnelle le matin même a donc
          # transformé une étape sautée en étape TOUJOURS en échec — un rouge sur
          # « Open PR for pushed branch » à CHAQUE poussée de branche du dépôt.
          # Le workflow, lui, déclare `actions: write` (bloc `permissions`
          # ci-dessus) : ce jeton-là peut dispatcher. C'est celui qu'on prend.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Chaque dispatch est jugée séparément : une qui échoue ne doit pas
          # empêcher les deux autres de partir.
          ko=""
          for spec in "ci.yml" "migration-gate.yml -f base=main" "codeql.yml"; do
            # shellcheck disable=SC2086
            if ! gh workflow run $spec --repo "$REPO" --ref "$BRANCH"; then
              ko="$ko ${spec%% *}"
            fi
          done

          if [ -n "$ko" ]; then
            # AVERTISSEMENT, pas erreur — et la nuance a un prix mesuré. Cette
            # étape est le FILET : les checks requis arrivent normalement par
            # l'événement `pull_request`, et la dispatch ne sert que le jour où
            # ils n'arrivent pas (panne transitoire du 2026-08-23, détaillée
            # ci-dessus). Faire rougir le job quand le filet ne se déploie pas
            # met un rouge permanent sur toutes les PR du dépôt sans rien
            # protéger : ce rouge n'est pas requis, donc il ne bloque aucun
            # merge, il ne fait que bruiter — et une alarme qu'on apprend à
            # ignorer ne vaut pas mieux qu'une alarme absente. Le vrai signal
            # d'une PR sans checks reste ses checks requis figés en
            # « Expected », que la session de garde voit (DoD §8).
            echo "::warning title=Dispatch de secours indisponible::Impossible de lancer :$ko sur '$BRANCH'. Si les checks requis restent en « Expected », dispatchez-les à la main — et vérifiez la portée 'actions: write' du jeton utilisé."
          fi
          # `USING_PAT` n'arbitre plus rien, mais reste tracé ici : c'est cette
          # ligne de log qui a permis de comprendre la PR #823 (dispatch sautée
          # alors qu'aucun run `pull_request` n'arrivait). Sans elle, le prochain
          # diagnostic repart de zéro.
          echo "Dispatched ci.yml + migration-gate.yml + codeql.yml on $BRANCH (USING_PAT=$USING_PAT ; dispatch inconditionnelle)."
