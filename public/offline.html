<!doctype html>
<!--
  Page de repli du service worker (public/sw.js) — servie depuis son cache quand une
  navigation complète échoue faute de réseau.

  STATIQUE ET SANS SCRIPT, à dessein (étude 38, R-10 et D-5) : elle vit hors de
  l'application, et la politique de sécurité par nonce tuerait tout script posé ici.
  Sans script, pas de cookie de langue à lire : les trois langues sont empilées.
  Les couleurs suivent le schéma du système (`prefers-color-scheme`), pas nos thèmes.
  « Réessayer » est un lien vers la page elle-même : l'adresse affichée est restée
  celle que le lecteur demandait, le lien la redemande.

  Toute retouche ici s'accompagne d'un changement de VERSION dans sw.js : c'est ce
  qui purge la copie que les navigateurs ont déjà en cache.
-->
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f5ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <title>Hors connexion · Offline · غير متصل — Na9ra Nal3ab</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f5ee;
        --fg: #1c1a14;
        --muted: #5a5548;
        --rule: #d9d3c2;
        --accent: #6b4e00;
        --accent-bg: #f1e3b4;
        --accent-border: #a47c0c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --fg: #f5f5f5;
          --muted: #b9b4a7;
          --rule: #2e2a20;
          --accent: #f7e8b0;
          --accent-bg: #2a2209;
          --accent-border: #a8892c;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          "Space Grotesk",
          system-ui,
          -apple-system,
          "Segoe UI",
          "Noto Sans Arabic",
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      main {
        width: 100%;
        max-width: 420px;
      }
      .crown {
        width: 72px;
        height: 72px;
        margin: 0 auto 8px;
        color: var(--accent-border);
      }
      section {
        padding: 20px 0;
      }
      section + section {
        border-top: 1px solid var(--rule);
      }
      h1,
      h2 {
        font-size: 1.35rem;
        line-height: 1.3;
        margin: 0 0 6px;
      }
      p {
        color: var(--muted);
        line-height: 1.6;
        margin: 0 0 14px;
      }
      a {
        display: inline-block;
        min-height: 44px;
        padding: 10px 22px;
        border: 1px solid var(--accent-border);
        border-radius: 12px;
        background: var(--accent-bg);
        color: var(--accent);
        font-weight: 700;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      a:focus-visible {
        outline: 3px solid var(--accent-border);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        class="crown"
        viewBox="0 0 512 512"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
        fill="currentColor"
      >
        <path d="M120 348 L120 250 L180 300 L256 198 L332 300 L392 250 L392 348 Z" />
        <rect x="120" y="356" width="272" height="42" rx="10" />
        <circle cx="120" cy="250" r="20" />
        <circle cx="256" cy="193" r="22" />
        <circle cx="392" cy="250" r="20" />
      </svg>
      <section lang="fr" dir="ltr">
        <h1>Hors connexion</h1>
        <p>Cette page ne peut pas se charger sans réseau. Elle revient dès qu'il est là.</p>
        <a href="">Réessayer</a>
      </section>
      <section lang="en" dir="ltr">
        <h2>Offline</h2>
        <p>This page can't load without a network. It comes back as soon as it's there.</p>
        <a href="">Try again</a>
      </section>
      <section lang="ar" dir="rtl">
        <h2>غير متصل</h2>
        <p>لا يمكن تحميل هذه الصفحة دون شبكة. تعود فور توفّرها.</p>
        <a href="">أعد المحاولة</a>
      </section>
    </main>
  </body>
</html>
